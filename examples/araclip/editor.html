<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ARA Clip</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #12141c; color: #e6e8ef; }
    main { padding: 20px 24px; display: grid; gap: 14px; }
    h1 { margin: 0; font-size: 20px; }
    .status { color: #8b93a7; font-size: 12px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #8b93a7; padding: 4px 8px; }
    td { padding: 6px 8px; border-top: 1px solid #232838; }
    input[type="range"] { width: 100%; }
    .num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <div class="status" id="status"></div>
    <table>
      <thead><tr><th>Clip</th><th>Recording</th><th>Gain</th><th></th><th>Reverse</th><th>Notes</th></tr></thead>
      <tbody id="clips"></tbody>
    </table>
  </main>
  <script>
    document.getElementById("title").textContent = vst3go.plugin.name;
    const status = document.getElementById("status");
    const body = document.getElementById("clips");
    const rows = new Map();

    // One row per clip; the controls send the clip's new state ("set").
    function row(clip) {
      let r = rows.get(clip.id);
      if (r) return r;
      const tr = document.createElement("tr");
      const name = document.createElement("td");
      const source = document.createElement("td");
      const gainCell = document.createElement("td");
      const gain = document.createElement("input");
      gain.type = "range";
      gain.min = "-60";
      gain.max = "12";
      gain.step = "0.1";
      gainCell.append(gain);
      const gainText = document.createElement("td");
      gainText.className = "num";
      const reverseCell = document.createElement("td");
      const reverse = document.createElement("input");
      reverse.type = "checkbox";
      reverseCell.append(reverse);
      const notes = document.createElement("td");
      notes.className = "num";
      tr.append(name, source, gainCell, gainText, reverseCell, notes);
      body.append(tr);
      const send = () => vst3go.send("set", { id: clip.id, gainDB: Number(gain.value), reverse: reverse.checked });
      gain.addEventListener("input", () => { gainText.textContent = `${Number(gain.value).toFixed(1)} dB`; send(); });
      gain.addEventListener("dblclick", () => { gain.value = "0"; send(); });
      reverse.addEventListener("change", send);
      r = { tr, name, source, gain, gainText, reverse, notes };
      rows.set(clip.id, r);
      return r;
    }

    vst3go.on("state", (s) => {
      status.textContent = !s.ara ? "Not bound to an ARA document: the input passes through"
        : s.clips.length ? "" : "No clips yet";
      const seen = new Set();
      for (const clip of s.clips) {
        seen.add(clip.id);
        const r = row(clip);
        r.name.textContent = clip.name || clip.id;
        r.source.textContent = clip.source;
        if (document.activeElement !== r.gain) {
          r.gain.value = String(clip.gainDB);
          r.gainText.textContent = `${clip.gainDB.toFixed(1)} dB`;
        }
        r.reverse.checked = clip.reverse;
        r.notes.textContent = clip.analyzing ? "…" : String(clip.notes);
      }
      for (const [id, r] of rows) {
        if (!seen.has(id)) {
          r.tr.remove();
          rows.delete(id);
        }
      }
    });
    vst3go.send("state");
    setInterval(() => vst3go.send("state"), 300);
  </script>
</body>
</html>
