<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sampler</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #12141c; color: #e6e8ef; }
    main { padding: 20px 24px; display: grid; gap: 18px; }
    h1 { margin: 0; font-size: 20px; }
    form { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; background: #232838; color: inherit; border: 1px solid #3a4157; border-radius: 6px; padding: 6px 8px; }
    button { background: #6c8cff; color: #0b0d14; border: 0; border-radius: 6px; padding: 6px 16px; }
    .status { color: #8b93a7; font-size: 12px; min-height: 1em; }
    .status.error { color: #ff7a7a; }
    .params { display: grid; grid-template-columns: max-content 1fr 7em; gap: 10px 14px; align-items: center; }
    .params label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #8b93a7; }
    .value { font-variant-numeric: tabular-nums; font-size: 13px; text-align: right; }
  </style>
</head>
<body>
  <main>
    <h1 id="title"></h1>
    <form id="load">
      <input id="path" type="text" placeholder="/path/to/sample.wav" spellcheck="false" />
      <button type="submit">Load</button>
    </form>
    <div class="status" id="status"></div>
    <div class="params" id="params"></div>
  </main>
  <script>
    document.getElementById("title").textContent = vst3go.plugin.name;

    // File: the processor decodes it in the background ("load") and
    // reports progress on status polls.
    const pathInput = document.getElementById("path");
    document.getElementById("load").addEventListener("submit", (event) => {
      event.preventDefault();
      vst3go.send("load", { path: pathInput.value.trim() });
    });
    const status = document.getElementById("status");
    let shownPath = null;
    vst3go.on("status", (s) => {
      status.classList.toggle("error", Boolean(s.error));
      if (s.error) status.textContent = s.error;
      else if (s.loading) status.textContent = "Loading…";
      else if (!s.path) status.textContent = "Built-in tone";
      else status.textContent = `${s.seconds.toFixed(2)} s · ${s.channels === 2 ? "stereo" : "mono"} · root ${s.rootNote}` + (s.looped ? " · looped" : "");
      if (s.path !== shownPath && document.activeElement !== pathInput) {
        pathInput.value = s.path;
        shownPath = s.path;
      }
    });
    vst3go.send("status");
    setInterval(() => vst3go.send("status"), 250);

    // Parameters: one range input each.
    const grid = document.getElementById("params");
    const views = new Map();
    for (const param of vst3go.params) {
      if (param.hidden || param.readOnly) continue;
      const label = document.createElement("label");
      label.textContent = param.name;
      const input = document.createElement("input");
      input.type = "range";
      input.min = "0";
      input.max = "1";
      input.step = "0.001";
      input.addEventListener("input", () => param.setNormalized(Number(input.value)));
      input.addEventListener("dblclick", () => param.reset());
      param.bindGesture(input);
      const value = document.createElement("span");
      value.className = "value";
      grid.append(label, input, value);
      const show = () => {
        input.value = String(param.normalized);
        value.textContent = param.text + (param.unit && !param.text.endsWith(param.unit) ? ` ${param.unit}` : "");
      };
      views.set(param, show);
      show();
    }
    vst3go.onParamChange((param) => { const show = views.get(param); if (show) show(); });
  </script>
</body>
</html>
