<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jovaris Track Meter</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#d9d5ca;background:#171819;--gold:#c5aa70;--line:#58574c}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #ead39e;outline-offset:2px}
body{padding:3px;background:#111313}.surface{height:100%;display:grid;grid-template-rows:43px 1fr 24px;border:1px solid #7a7a6d;border-radius:7px;overflow:hidden;box-shadow:inset 2px 2px 2px #93958e50,inset -2px -2px 2px #000,0 2px 5px #000;background:repeating-linear-gradient(0deg,#ffffff02 0px,#ffffff02 1px,transparent 1px,transparent 3px),linear-gradient(110deg,#2a2c2b 0%,#171918 10%,#252625 48%,#151716 95%)}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 19px;border-bottom:1px solid var(--gold);box-shadow:0 3px 4px #0008}.brand{font-size:11px;letter-spacing:3.4px;white-space:nowrap;text-shadow:0 1px 1px #000}h1{margin:0;font-size:18px;font-weight:450;letter-spacing:5px;text-shadow:0 2px 1px #000}.header-right{display:flex;align-items:center;gap:13px}.product-number{font-size:22px;color:#9e8859;letter-spacing:1px}.layout{display:flex;border:1px solid #66675e;border-radius:4px;padding:2px;background:#090b0a;box-shadow:0 0 0 2px #0007}.layout button{padding:0 7px;height:22px;border:0;background:none;color:#8a8d85;font-size:15px}.layout button+button{border-left:1px solid #5b5c54}.layout button[aria-pressed=true]{color:#edc875;text-shadow:0 0 7px #bf8b37}
.work{display:grid;grid-template-columns:213px 1fr;gap:14px;padding:12px 16px 4px;min-height:0}.section-title{display:flex;align-items:center;gap:12px;margin:0 0 8px;font-size:15px;letter-spacing:3px;font-weight:450}.section-title:before,.section-title:after{content:"";height:1px;background:var(--gold);flex:1}.peak-panel{border-right:1px solid #070909;padding-right:14px;box-shadow:1px 0 0 #54564b;display:grid;grid-template-rows:25px 1fr 29px;min-height:0}.peak-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0;padding:0 7px 8px}.peak-channel{display:flex;flex-direction:column;align-items:center;min-height:0}.peak-column{position:relative;flex:1;min-height:70px;width:69px;display:grid;grid-template-columns:30px 30px;gap:6px;padding-top:19px}.peak-unit{position:absolute;left:0;top:0;font-size:9px;color:#bcbeb3}.peak-scale{position:relative;height:100%;color:#b8bbaf;font-size:9px;font-variant-numeric:tabular-nums}.peak-scale span{position:absolute;right:0;transform:translateY(-50%)}.peak-scale span:first-child{transform:none}.peak-scale span:last-child{transform:translateY(-100%)}.bar-shell{position:relative;padding:5px 4px;border:1px solid #55584d;border-radius:4px;background:#020503;box-shadow:0 0 0 2px #050605,inset 1px 1px 3px #000;min-height:0}.leds{display:flex;flex-direction:column-reverse;gap:2px;width:100%;height:100%}.led{flex:1;min-height:0;background:var(--led);opacity:.1;box-shadow:inset 0 1px 1px #ffffff17}.led.on{opacity:1;box-shadow:0 0 4px var(--led),inset 0 1px 1px #ffffff65}.hold-marker{position:absolute;height:2px;left:1px;right:1px;background:#fff6cf;box-shadow:0 0 3px #fff;display:none;pointer-events:none}.clip{position:absolute;top:5px;left:39px;width:25px;height:9px;border-radius:1px;background:#48201a;border:1px solid #73372c;font-size:6px;letter-spacing:.6px;text-align:center;color:#af7768;line-height:7px}.clip.active{background:#d65235;color:#fff1c9;box-shadow:0 0 7px #dd4d27}
.peak-readout{font-size:15px;line-height:24px;min-width:65px;text-align:center;padding:0 4px;margin-top:6px;background:#050806;border:1px solid #5a5c50;border-radius:3px;box-shadow:0 0 0 1px #000;color:#f1e8cf;font-variant-numeric:tabular-nums}.channel-letter{font-size:12px;line-height:20px;color:#b4b9ad}.peak-controls{display:grid;grid-template-columns:1.4fr 1fr;gap:6px}.panel-button{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:0 10px;border:1px solid #67685d;border-radius:3px;background:linear-gradient(#292c27,#10130f);box-shadow:0 0 0 2px #050605,inset 0 1px 1px #797b6d33;color:#c9cec0;font-size:9px;letter-spacing:1.3px;white-space:nowrap}.panel-button .indicator{height:13px;width:2px;background:#5c543b}.panel-button[aria-pressed=true]{border-color:#c5aa70;color:#f0d7a3;background:linear-gradient(#3b3728,#171a12)}.panel-button[aria-pressed=true] .indicator,.panel-button.pressed .indicator{background:#e9c471;box-shadow:0 0 6px #c59b43}
.vu-panel{min-width:0;display:flex;flex-direction:column}.vu-pair{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-items:center;flex:1;min-height:0}.vu-module{min-width:0;display:flex;flex-direction:column;align-items:stretch}.bezel{padding:8px;border:1px solid #73756a;border-radius:13px;background:linear-gradient(150deg,#343831,#050805 38%,#121611 70%,#2e332a);box-shadow:0 0 0 2px #050705,inset 2px 2px 2px #c6cbb030,0 3px 4px #0007}.dial{display:block;width:100%;aspect-ratio:340/210;border:1px solid #6b5d34;border-radius:4px;background:radial-gradient(ellipse at 50% 40%,#f3dfac 15%,#e2c58c 65%,#b39354 100%);box-shadow:inset 0 0 13px #332600aa}.dial text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1f2116;font-weight:550}.dial .needle{stroke:#191d13;stroke-width:2.1;filter:drop-shadow(2px 1px 1px #0004)}.vu-reading{font-size:9px;text-align:center;color:#a5ab9b;font-variant-numeric:tabular-nums;line-height:18px;margin-top:4px}.calibration{display:flex;align-items:center;justify-content:center;gap:12px;font-size:10px;letter-spacing:1.5px;color:#d3cbb3;margin:7px 7px 10px;white-space:nowrap}.calibration:before,.calibration:after{content:"";height:1px;background:#8c8b79;flex:1}
footer{display:flex;align-items:center;gap:12px;padding:0 18px 6px;font-size:9px;color:#a6ac9d;letter-spacing:1.4px}footer:before{content:"";height:1px;flex:1;background:var(--gold)}.version{font-size:8px;letter-spacing:.4px;color:#7d8575}.signature{white-space:nowrap}.ui-error{display:none;position:absolute;inset:10px;padding:20px;background:#20251c;color:#f6dfac;font-size:14px;z-index:5}
.vertical .surface{grid-template-rows:63px 1fr 29px}.vertical header{padding:8px 16px;display:grid;grid-template-columns:1fr auto;grid-template-rows:18px 24px;gap:2px 10px}.vertical .brand{grid-column:1/-1;font-size:12px;letter-spacing:3px}.vertical h1{font-size:17px;letter-spacing:3px}.vertical .header-right{gap:13px}.vertical .work{grid-template-columns:1fr;grid-template-rows:302px 1fr;gap:12px;padding:13px 17px 5px}.vertical .peak-panel{border-right:0;box-shadow:none;border-bottom:1px solid var(--gold);padding:0 2px 13px;grid-template-rows:24px 1fr 30px}.vertical .peak-pair{padding:0 50px 7px;gap:40px}.vertical .peak-column{width:78px;grid-template-columns:32px 36px;gap:7px}.vertical .clip{left:42px;width:31px}.vertical .peak-scale{font-size:10px}.vertical .peak-readout{min-width:75px;font-size:17px;line-height:24px}.vertical .channel-letter{line-height:20px}.vertical .peak-controls{gap:10px;grid-template-columns:1fr 1fr}.vertical .panel-button{font-size:11px;letter-spacing:2px;padding:0 18px}.vertical .vu-pair{grid-template-columns:1fr;gap:7px;align-content:center}.vertical .vu-module{width:100%;max-width:340px;margin:0 auto}.vertical .bezel{padding:6px;border-radius:10px}.vertical .dial{height:auto;aspect-ratio:340/210}.vertical .vu-reading{line-height:12px;margin-top:2px;font-size:8px}.vertical .calibration{margin:8px 0 0;font-size:9px;letter-spacing:1px;gap:9px}.vertical .section-title{margin-bottom:6px}.vertical footer{font-size:9px;padding:0 16px 5px}
</style>
</head>
<body class="horizontal">
<div class="surface">
<header><div class="brand">JOVARIS AUDIO</div><h1>TRACK METER</h1><div class="header-right"><div class="layout" role="group" aria-label="Meter layout"><button type="button" id="layout-h" aria-pressed="true" title="Horizontal layout">H</button><button type="button" id="layout-v" aria-pressed="false" title="Vertical layout">V</button></div><span class="product-number">03</span></div></header>
<main class="work">
<section class="peak-panel" aria-label="Stereo sample peak"><h2 class="section-title">PEAK</h2><div class="peak-pair" id="peak-pair"></div><div class="peak-controls"><button type="button" class="panel-button" id="hold" aria-pressed="false"><span>PEAK HOLD</span><i class="indicator"></i></button><button type="button" class="panel-button" id="reset"><span>RESET</span><i class="indicator"></i></button></div></section>
<section class="vu-panel" aria-label="Stereo analog VU"><h2 class="section-title">VU</h2><div class="vu-pair" id="vu-pair"></div><div class="calibration">0 VU = −18 dBFS RMS</div></section>
</main>
<footer><span class="version" id="version">0.1.3</span><span class="signature">Designed by WH</span></footer>
</div><div class="ui-error" id="ui-error" role="alert"></div>
<script>
(function(){
'use strict';
const fail=document.getElementById('ui-error');
try{
const sdk=window.vst3go;if(!sdk)throw new Error('Plugin connection unavailable');
const param=id=>{const p=sdk.param(id);if(!p)throw new Error('Missing parameter '+id);return p;};
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const angle=vu=>-53+106*(Math.pow(10,clamp(vu,-20,3)/20)-.1)/(Math.pow(10,3/20)-.1);
const point=(a,r)=>[170+Math.sin(a*Math.PI/180)*r,220-Math.cos(a*Math.PI/180)*r];
const ns='http://www.w3.org/2000/svg';
function svg(tag,attrs){const n=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));return n;}
function arc(from,to,r){const a=point(from,r),b=point(to,r);return 'M '+a[0]+' '+a[1]+' A '+r+' '+r+' 0 0 1 '+b[0]+' '+b[1];}
function number(v){if(v<=-119.99)return '−∞';const x=Math.abs(v)<.05?0:v;return (x>0?'+':'')+x.toFixed(1).replace('-','−');}
// Match the original meter's expanded scale near clipping. The same
// mapping drives printed ticks, LED thresholds, and the held marker.
const peakTicks=[0,-3,-6,-12,-18,-24,-30,-36,-48,-60];
function peakPosition(db){const x=clamp(db,-60,0);for(let i=0;i<peakTicks.length-1;i++){if(x>=peakTicks[i+1])return(i+(peakTicks[i]-x)/(peakTicks[i]-peakTicks[i+1]))/(peakTicks.length-1);}return 1;}
function dbAtPosition(pos){const x=clamp(pos,0,1)*(peakTicks.length-1),i=Math.min(peakTicks.length-2,Math.floor(x));return peakTicks[i]+(peakTicks[i+1]-peakTicks[i])*(x-i);}
const holdP=param(1),layoutP=param(3),views=[],meterViews=[];
let snapshot=null, lastBlock=-1, lastAudio=performance.now(), idle=false;
const reading=(p)=>snapshot ? snapshot.values[p.id-10] : p.plain;
const shown=(p)=>{
 if(snapshot && snapshot.pending && [10,11,14,15,16,17].includes(p.id))return p.id>=16?0:-120;
 if(idle && ([10,11].includes(p.id) || (holdP.plain<.5 && [14,15].includes(p.id))))return -120;
 if(idle && holdP.plain<.5 && [16,17].includes(p.id))return 0;
 return reading(p);
};
sdk.on('meter-snapshot',data=>{
 if(!data || !Array.isArray(data.values) || data.values.length!==8)return;
 snapshot=data;
 if(data.blocks!==lastBlock){lastBlock=data.blocks;lastAudio=performance.now();}
 idle=performance.now()-lastAudio>750;
 meterViews.forEach(fn=>fn());
 const status=document.getElementById('version');
 status.textContent=sdk.plugin.version+(idle?' · IDLE':'');
 status.title=idle?'Audio processing is paused; held peaks remain until Reset.':'Receiving audio blocks';
});
setInterval(()=>sdk.send('meter-poll'),1000/30);
sdk.send('meter-poll');
['L','R'].forEach((name,ch)=>{
const peak=document.createElement('div');peak.className='peak-channel';
peak.innerHTML='<div class="peak-column"><span class="peak-unit">dBFS</span><div class="peak-scale"></div><div class="bar-shell"><div class="leds"></div><div class="hold-marker"></div></div><span class="clip" id="clip-'+name+'">CLIP</span></div><output class="peak-readout" id="peak-'+name+'">−∞</output><span class="channel-letter">'+name+'</span>';
document.getElementById('peak-pair').appendChild(peak);
const scale=peak.querySelector('.peak-scale');peakTicks.forEach(db=>{const n=document.createElement('span');n.style.top=(peakPosition(db)*100)+'%';n.textContent=String(db).replace('-','−');scale.appendChild(n);});
const leds=[];for(let i=0;i<30;i++){const n=document.createElement('i');n.className='led';const db=dbAtPosition(1-(i+.5)/30);const c=db>=-4?'#ed612b':db>=-8?'#f2c437':db>=-18?'#b8d921':'#5db914';n.style.setProperty('--led',c);peak.querySelector('.leds').appendChild(n);leds.push(n);}
const vu=document.createElement('div');vu.className='vu-module';
vu.innerHTML='<div class="bezel"><svg class="dial" viewBox="0 0 340 210" preserveAspectRatio="xMidYMid meet" role="img" aria-label="'+name+' analog VU"><g class="scale"></g><text x="170" y="147" font-size="25" text-anchor="middle">VU</text><text x="22" y="188" font-size="20">'+name+'</text><line class="needle" x1="170" y1="220" x2="170" y2="43"/><circle cx="170" cy="220" r="27" fill="#151a10" stroke="#726340" stroke-width="2"/><circle cx="170" cy="220" r="16" fill="#343629" stroke="#af965e"/></svg></div><output class="vu-reading" id="vu-'+name+'">−20.0 VU</output>';
document.getElementById('vu-pair').appendChild(vu);
const group=vu.querySelector('.scale');group.appendChild(svg('path',{d:arc(-53,53,152),stroke:'#31341f',fill:'none','stroke-width':1.8}));group.appendChild(svg('path',{d:arc(angle(0),53,155),stroke:'#ac3c29',fill:'none','stroke-width':9}));
[-20,-10,-7,-5,-3,-1,0,1,2,3].forEach(v=>{const a=angle(v),a1=point(a,154),a2=point(a,173),pos=point(a,190);group.appendChild(svg('line',{x1:a1[0],y1:a1[1],x2:a2[0],y2:a2[1],stroke:v>=0?'#a83b29':'#2c301c','stroke-width':v===0?2:1.5}));const n=svg('text',{x:pos[0],y:pos[1]+4,'text-anchor':'middle','font-size':14});n.textContent=v>0?'+'+v:String(v);if(v>0)n.style.fill='#a83b29';group.appendChild(n);});
const needle=vu.querySelector('.needle'),vuNumber=vu.querySelector('.vu-reading'),read=peak.querySelector('.peak-readout'),clip=peak.querySelector('.clip'),marker=peak.querySelector('.hold-marker');
const liveP=param(10+ch),vuP=param(12+ch),readP=param(14+ch),clipP=param(16+ch);
const updateVU=()=>{needle.setAttribute('transform','rotate('+angle(idle?-20:shown(vuP))+' 170 220)');vuNumber.textContent=(idle?'—':number(shown(vuP)))+' VU';vu.querySelector('.dial').setAttribute('aria-label',name+' '+vuNumber.textContent);};
const updateLive=()=>{const value=(1-peakPosition(shown(liveP)))*30;leds.forEach((n,i)=>n.classList.toggle('on',value>i));};
const updatePeak=()=>{read.textContent=number(shown(readP));read.title=name+' Sample Peak '+number(shown(readP))+' dBFS';const height=1-peakPosition(shown(readP));marker.style.bottom='calc(5px + '+(height*100)+'% - '+(height*10)+'px)';marker.style.display=holdP.plain>=.5&&shown(readP)>-120?'block':'none';};
const updateClip=()=>{const on=shown(clipP)>=.5;clip.classList.toggle('active',on);clip.setAttribute('aria-label',name+' clip '+(on?'on':'off'));};
[[liveP,updateLive],[vuP,updateVU],[readP,updatePeak],[clipP,updateClip]].forEach(([p,fn])=>{p.onChange(fn);meterViews.push(fn);fn();});views.push(updatePeak);
});
const hold=document.getElementById('hold'),reset=document.getElementById('reset'),h=document.getElementById('layout-h'),v=document.getElementById('layout-v');
function edit(p,value){p.beginEdit();p.setPlain(value);p.endEdit();}
function updateHold(){hold.setAttribute('aria-pressed',String(holdP.plain>=.5));views.forEach(fn=>fn());}
holdP.onChange(updateHold);updateHold();hold.addEventListener('click',()=>edit(holdP,holdP.plain>=.5?0:1));
reset.addEventListener('click',()=>{sdk.send('reset-peak');reset.classList.add('pressed');setTimeout(()=>reset.classList.remove('pressed'),150);});
let mode=-1;
function updateLayout(){const next=layoutP.plain>=.5?1:0;if(next===mode)return;mode=next;document.body.className=next?'vertical':'horizontal';h.setAttribute('aria-pressed',String(!next));v.setAttribute('aria-pressed',String(!!next));sdk.resize(next?400:800,next?940:380);}
layoutP.onChange(updateLayout);updateLayout();h.addEventListener('click',()=>edit(layoutP,0));v.addEventListener('click',()=>edit(layoutP,1));
document.getElementById('version').textContent=sdk.plugin.version;
}catch(e){fail.textContent='Meter connection error: '+e.message;fail.style.display='block';throw e;}
})();
</script>
</body></html>
